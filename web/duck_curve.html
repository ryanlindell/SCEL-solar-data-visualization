<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hawaiʻi grid: duck curve</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  </head>
  <body>
    <main class="page">
      <nav class="site-nav" aria-label="Charts">
        <a href="index.html">Renewable share</a>
        <a href="duck_curve.html" aria-current="page">Duck curve</a>
        <a href="curtailment.html">Curtailment</a>
        <a href="battery.html">Battery</a>

      <h1><span id="title">A typical weekday on the grid</span><span class="tag">Modeled</span></h1>

      <div class="controls" id="season-controls" role="radiogroup" aria-label="Season"></div>

        <div id="curtailment-explainer-body"></div>

      <ul class="notes" id="notes"></ul>

      <details>
        <summary>View the data as a table</summary>
        <div class="table-wrap">
          <table id="data-table"></table>
        </div>
      </details>

      <p class="source" id="source"></p>
    </main>

    <script type="module" src="js/duck_curve.js"></script>
